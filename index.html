<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bonds and Targets</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700&display=swap">
<style>
/* Layout: one play column. Game tabs, grade + level pills, a white board, big tappable tiles underneath. */
:root{
  --bg:#eef4f1; --card:#ffffff; --ink:#1f2b33; --muted:#5d6f78;
  --whole:#2f6fd6; --part:#e2553f; --good:#1f9d6b; --line:#c9d6d0; --tile:#f6faf8;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#142026; --card:#1c2b33; --ink:#eaf2ef; --muted:#9fb3ad;
  --whole:#6fa2f2; --part:#f07a65; --good:#43c493; --line:#33464f; --tile:#22343d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#142026; --card:#1c2b33; --ink:#eaf2ef; --muted:#9fb3ad;
  --whole:#6fa2f2; --part:#f07a65; --good:#43c493; --line:#33464f; --tile:#22343d; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px}
main{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.game{display:flex;flex-direction:column;gap:12px}
.tabs,.seg{display:flex;gap:6px;background:var(--card);padding:5px;border-radius:16px}
.tabs button,.seg button{flex:1;font:800 1.05rem var(--display);padding:8px 4px;border-radius:12px;border:none;background:none;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--card)}
.seg{padding:4px;border-radius:14px}
.seg button{font-size:.95rem;padding:6px 4px}
.seg button[aria-pressed="true"]{background:var(--whole);color:var(--card)}
.ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lbl{font-weight:700;color:var(--muted);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;min-width:3.4rem}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pills button{font:800 1rem var(--display);min-width:42px;padding:5px 12px;border-radius:999px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.pills button[aria-pressed="true"]{border-color:var(--whole);background:var(--whole);color:var(--card)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.note{margin:0;color:var(--muted);font-size:.9rem;flex:1;min-width:0}
.stats{font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;font-size:.95rem;white-space:nowrap}
.stats b{color:var(--ink)}
.board{background:var(--card);border-radius:20px;padding:18px 12px 14px;display:flex;flex-direction:column;align-items:center;gap:10px}
.prompt{margin:0;color:var(--muted);font-weight:700;text-align:center;text-wrap:balance}
.msg{min-height:1.4em;text-align:center;font-weight:700;margin:0;text-wrap:balance}
.link{font:700 .85rem var(--body);color:var(--muted);background:none;border:none;text-decoration:underline;cursor:pointer;padding:4px}
button:focus-visible{outline:3px solid var(--whole);outline-offset:2px}
.progress{display:flex;gap:5px;justify-content:center}
.progress span{width:22px;height:8px;border-radius:4px;background:var(--line)}
.progress span.done{background:var(--good)}
.progress span.miss{background:var(--part)}
.big{font:800 1.15rem var(--display);padding:10px 26px;border-radius:14px;border:none;background:var(--whole);color:var(--card);cursor:pointer}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}

/* Bonds */
svg.bond{width:100%;max-width:300px;height:auto;overflow:visible}
.bond line{stroke:var(--line);stroke-width:6;stroke-linecap:round}
.bond circle{stroke-width:5}
.bond .w{fill:var(--card);stroke:var(--whole)}
.bond .p{fill:var(--card);stroke:var(--part)}
.bond .gap{fill:var(--tile);stroke:var(--part);stroke-dasharray:9 7}
.bond text{font-family:var(--display);font-weight:800;text-anchor:middle;dominant-baseline:central;fill:var(--ink)}
.bond .q{fill:var(--part)}
.bond.win .gap{fill:var(--good);stroke:var(--good);stroke-dasharray:none}
.bond.win .q{fill:var(--card)}
.eq{margin:0;font:800 1.9rem/1.1 var(--display);font-variant-numeric:tabular-nums;text-align:center}
.eq .q{color:var(--part)}
.eq.win .q{color:var(--good)}
.hint{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
.frames{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.frame{display:grid;grid-template-columns:repeat(5,22px);gap:4px;padding:5px;border:2px solid var(--line);border-radius:8px}
.dot{width:22px;height:22px;border-radius:50%;border:2px dashed var(--line)}
.dot.a{background:var(--whole);border:none}
.dot.b{background:var(--part);border:none}
.bar{display:grid;gap:3px;width:100%;max-width:300px;padding:4px;border:2px solid var(--line);border-radius:8px}
.bar span{height:24px;border-radius:4px;border:2px dashed var(--line)}
.bar span.a{background:var(--whole);border:none}
.choices{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.choices button{font:800 1.7rem var(--display);padding:12px 0;border-radius:16px;border:3px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;touch-action:manipulation;font-variant-numeric:tabular-nums}
.choices button.sm{font-size:1.25rem}
.choices button.no{border-color:var(--part);color:var(--part);opacity:.55}
.choices button.yes{border-color:var(--good);background:var(--good);color:var(--card)}

/* Make the number */
.target{display:flex;flex-direction:column;align-items:center}
.target small{font-weight:700;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;font-size:.75rem}
.target strong{font:800 3.6rem/1 var(--display);color:var(--whole)}
.target.win strong{color:var(--good)}
.nums{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%}
.nums button{font:800 2rem var(--display);aspect-ratio:1;max-width:100%;border-radius:18px;border:3px solid var(--line);background:var(--tile);color:var(--ink);cursor:pointer;touch-action:manipulation}
.nums button.sel{border-color:var(--part);background:var(--part);color:var(--card)}
.nums button.new{border-color:var(--whole)}
.nums button:disabled{visibility:hidden}
.ops{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.ops button{font:800 1.9rem var(--display);padding:8px 0;border-radius:14px;border:3px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;touch-action:manipulation}
.ops button.sel{border-color:var(--whole);background:var(--whole);color:var(--card)}
.steps{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:700;text-align:center;min-height:1.3em;margin:0}
.row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
</style>
</head>
<body>

<main>
  <div class="tabs" role="tablist">
    <button id="tabBonds" role="tab" aria-selected="true">Number Bonds</button>
    <button id="tabMake" role="tab" aria-selected="false">Make the Number</button>
  </div>

  <!-- NUMBER BONDS -->
  <section class="game" id="bondsGame">
    <div class="ctl"><span class="lbl">Grade</span><div class="pills" id="bGrades"></div></div>
    <div class="ctl"><span class="lbl">Level</span><div class="pills" id="bLevels"><button data-l="1">1</button><button data-l="2">2</button></div></div>
    <div class="top"><p class="note" id="bNote"></p><div class="stats">Streak <b id="streak">0</b> · Best <b id="best">0</b></div></div>
    <div class="board">
      <div id="bPlay" style="display:contents">
        <p class="prompt" id="bPrompt"></p>
        <svg class="bond" id="bond" viewBox="0 0 300 220" role="img" aria-label="Number bond">
          <line x1="150" y1="58" x2="70" y2="160"/><line x1="150" y1="58" x2="230" y2="160"/>
          <circle cx="150" cy="58" r="50" id="cW"/><text x="150" y="58" id="tW"></text>
          <circle cx="70" cy="160" r="46" id="cA"/><text x="70" y="160" id="tA"></text>
          <circle cx="230" cy="160" r="46" id="cB"/><text x="230" y="160" id="tB"></text>
        </svg>
        <p class="eq" id="eq"></p>
        <div class="hint" id="hint" hidden></div>
        <button class="link" id="hintBtn">Show a hint</button>
      </div>
      <div id="bEnd" hidden style="text-align:center">
        <p style="font:800 2.6rem/1 var(--display);margin:6px 0" id="bScore"></p>
        <p class="prompt" id="bEndMsg"></p>
        <p><button class="big" id="bAgain">Play again</button></p>
      </div>
    </div>
    <div class="choices" id="choices"></div>
    <p class="msg" id="bMsg" aria-live="polite"></p>
    <div class="progress" id="progress"></div>
  </section>

  <!-- MAKE THE NUMBER -->
  <section class="game" id="makeGame" hidden>
    <div class="seg" id="mBands"><button data-band="lo">Grades 1–2</button><button data-band="hi">Grades 3–5</button></div>
    <div class="ctl"><span class="lbl">Grade</span><div class="pills" id="mGrades"></div></div>
    <div class="top"><p class="note" id="mNote"></p><div class="stats">Solved <b id="solved">0</b></div></div>
    <div class="board">
      <div class="target" id="target"><small>Make</small><strong id="tNum">10</strong></div>
      <p class="prompt">Use all 4 numbers. Tap a number, a sign, then another number.</p>
      <div class="nums" id="nums"></div>
      <p class="steps" id="steps"></p>
    </div>
    <div class="ops" id="ops">
      <button data-op="+">+</button><button data-op="-">−</button><button data-op="*">×</button><button data-op="/">÷</button>
    </div>
    <p class="msg" id="mMsg" aria-live="polite"></p>
    <div class="row">
      <button class="link" id="undo">Undo</button>
      <button class="link" id="restart">Start over</button>
      <button class="link" id="showWay">Show a way</button>
      <button class="link" id="skip">New puzzle</button>
    </div>
  </section>
</main>

<script>
const $=id=>document.getElementById(id);
const rnd=n=>Math.floor(Math.random()*n);
const pick=arr=>arr[rnd(arr.length)];
const shuffle=a=>a.sort(()=>Math.random()-.5);
const cheers=["Nice!","You got it!","Super!","Great thinking!","Yes!"];
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* ---------- tabs ---------- */
function showTab(b){
  $('tabBonds').setAttribute('aria-selected',b);$('tabMake').setAttribute('aria-selected',!b);
  $('bondsGame').hidden=!b;$('makeGame').hidden=b;
}
$('tabBonds').onclick=()=>showTab(true);$('tabMake').onclick=()=>showTab(false);

/* ---------- formatting (all values are whole "units") ---------- */
const fInt=n=>String(n);
const fFrac=d=>n=>{if(n%d===0)return String(n/d);const w=Math.floor(n/d),r=n%d;return (w?w+' ':'')+r+'/'+d};
const fDec=n=>(n/100).toFixed(2).replace(/(\.\d*?)0+$/,'$1').replace(/\.$/,'');

/* ---------- NUMBER BONDS: grades K-5, two levels each (Common Core / CKMath) ---------- */
const add='add',both=['add','sub'],any=['a','b','w'],parts=['a','b'];
const BONDS={
  K:{1:{note:'Kindergarten: break apart numbers up to 5 (K.OA.3, K.OA.5).',gen(){const W=2+rnd(4);return{W,a:rnd(W+1),forms:[add],hides:any,kind:'count',fmt:fInt,step:1}}},
     2:{note:'Kindergarten: break apart numbers to 10 and find the partner that makes 10 (K.OA.3, K.OA.4).',gen(){const W=Math.random()<.6?10:6+rnd(4);return{W,a:rnd(W+1),forms:[add],hides:Math.random()<.6?parts:any,kind:'count',fmt:fInt,step:1}}}},
  1:{1:{note:'Grade 1: add and subtract within 10, find the missing number (1.OA.6, 1.OA.8).',gen(){const W=5+rnd(6);return{W,a:rnd(W+1),forms:both,hides:any,kind:'count',fmt:fInt,step:1}}},
     2:{note:'Grade 1: add and subtract within 20, using a ten and some more (1.OA.6).',gen(){const W=11+rnd(10);return{W,a:2+rnd(W-3),forms:both,hides:any,kind:'count',fmt:fInt,step:1}}}},
  2:{1:{note:'Grade 2: tens that make 100, like 30 + 70 (2.NBT.5).',gen(){return{W:100,a:10*(1+rnd(9)),forms:both,hides:parts,kind:'place',fmt:fInt,step:10}}},
     2:{note:'Grade 2: any pair that makes 100, like 64 + 36 (2.NBT.5).',gen(){let a;do{a=11+rnd(79)}while(a%10===0);return{W:100,a,forms:both,hides:parts,kind:'place',fmt:fInt,step:1}}}},
  3:{1:{note:'Grade 3: hundreds and tens that make 1,000, like 350 + 650 (3.NBT.2).',gen(){let a;do{a=10*(1+rnd(99))}while(a%100===0&&Math.random()<.6);return{W:1000,a,forms:both,hides:parts,kind:'place',fmt:fInt,step:10}}},
     2:{note:'Grade 3: any pair that makes 1,000, like 345 + 655 (3.NBT.2).',gen(){let a;do{a=101+rnd(799)}while(a%10===0);return{W:1000,a,forms:both,hides:parts,kind:'place',fmt:fInt,step:1}}}},
  4:{1:{note:'Grade 4: fractions that make 1 whole, like 3/8 + 5/8 (4.NF.3).',gen(){const d=pick([2,3,4,5,6,8,10,12]);return{W:d,a:1+rnd(d-1),forms:both,hides:parts,kind:'frac',fmt:fFrac(d),d,step:1}}},
     2:{note:'Grade 4: mixed numbers that make 2 or 3, like 1 1/4 + 3/4 (4.NF.3).',gen(){const d=pick([2,3,4,5,6,8]),W=d*(2+rnd(2));let a;do{a=1+rnd(W-1)}while(a%d===0);return{W,a,forms:both,hides:parts,kind:'frac',fmt:fFrac(d),d,step:1}}}},
  5:{1:{note:'Grade 5: decimals that make 1, like 0.35 + 0.65 (5.NBT.7).',gen(){const a=Math.random()<.3?10*(1+rnd(9)):1+rnd(99);return{W:100,a,forms:both,hides:parts,kind:'place',fmt:fDec,step:a%10===0?10:1}}},
     2:{note:'Grade 5: decimals that make 10, like 3.75 + 6.25 (5.NBT.7).',gen(){let a;do{a=1+rnd(999)}while(a%100===0);return{W:1000,a,forms:both,hides:parts,kind:'place',fmt:fDec,step:a%10===0?10:1}}}}
};
const GRADES=['K','1','2','3','4','5'];
const ROUND=10;
let bg=store.get('nb-g','1'), bl=store.get('nb-l',1), q=null, round=[], streak=0, best=store.get('nb-best2',0), missed=false, locked=false;
if(!BONDS[bg])bg='1';
$('bGrades').innerHTML=GRADES.map(g=>`<button data-g="${g}">${g}</button>`).join('');
document.querySelectorAll('#bGrades button').forEach(b=>b.onclick=()=>{bg=b.dataset.g;bl=1;store.set('nb-g',bg);store.set('nb-l',bl);startRound()});
document.querySelectorAll('#bLevels button').forEach(b=>b.onclick=()=>{bl=+b.dataset.l;store.set('nb-l',bl);startRound()});

function startRound(){
  round=[];streak=0;$('streak').textContent=0;$('bPlay').style.display='contents';$('bEnd').hidden=true;
  document.querySelectorAll('#bGrades button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.g===bg));
  document.querySelectorAll('#bLevels button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.l===bl));
  $('bNote').textContent=BONDS[bg][bl].note;nextBond();
}
function makeQ(){
  const s=BONDS[bg][bl].gen(), b=s.W-s.a, hide=pick(s.hides), form=pick(s.forms);
  return {...s,b,hide,form,ans:hide==='a'?s.a:hide==='b'?b:s.W,known:hide==='a'?b:s.a};
}
const val=k=>k==='w'?q.W:q[k];
function eqHTML(solved){
  const s=k=>q.hide===k?`<span class="q">${solved?q.fmt(q.ans):'?'}</span>`:q.fmt(val(k));
  return q.form==='add'?`${s('a')} + ${s('b')} = ${s('w')}`:`${s('w')} − ${s('a')} = ${s('b')}`;
}
function digitErr(k,W){ // common slip: making every digit add to 10
  const n=String(W).length-1;let e=0;
  for(let i=0;i<n;i++){const d=Math.floor(k/10**i)%10;if(d===0)return null;e+=(10-d)*10**i}
  return e;
}
function choicesFor(){
  const o=new Set([q.ans]), st=q.step, top=q.hide==='w'?q.W+3*st:q.W;
  const cands=[q.kind==='place'?digitErr(q.known,q.W):null,q.ans+st,q.ans-st,q.ans+2*st,q.ans-2*st,q.ans+10*st,q.ans-10*st,q.ans+3*st,q.ans-3*st];
  const front=cands.slice(0,1), rest=shuffle(cands.slice(1));
  [...front,...rest].forEach(v=>{if(o.size<4&&v!=null&&v>=0&&v<=top&&!(q.kind==='frac'&&v===0))o.add(v)});
  for(let i=1;o.size<4;i++)o.add(q.ans+i);
  return [...o].sort((x,y)=>x-y);
}
function setText(id,str,isQ){const t=$(id);t.textContent=str;t.setAttribute('class',isQ?'q':'');
  const L=str.length;t.style.fontSize=(L<=2?40:L===3?34:L===4?28:22)+'px'}
function nextBond(){
  if(round.length>=ROUND)return finishBonds();
  locked=false;missed=false;q=makeQ();
  $('bond').classList.remove('win','shake');$('eq').classList.remove('win');
  [['cW','tW','w','w'],['cA','tA','a','p'],['cB','tB','b','p']].forEach(([c,t,k,role])=>{
    const gap=q.hide===k;$(c).setAttribute('class',gap?'gap':role);setText(t,gap?'?':q.fmt(val(k)),gap)});
  $('eq').innerHTML=eqHTML(false);
  $('bPrompt').textContent=q.hide==='w'?'Put the parts together. What is the whole?':`${q.fmt(q.W)} is made of two parts. What is missing?`;
  $('hint').hidden=true;$('hintBtn').textContent='Show a hint';
  $('choices').innerHTML='';
  choicesFor().forEach(v=>{const btn=document.createElement('button');btn.textContent=q.fmt(v);if(btn.textContent.length>4)btn.classList.add('sm');
    btn.onclick=()=>pickBond(v,btn);$('choices').appendChild(btn)});
  $('bMsg').textContent='';paintProgress();
}
function hintHTML(){
  if(q.kind==='count'){
    const k=q.hide==='a'?{a:0,b:q.b}:q.hide==='b'?{a:q.a,b:0}:{a:q.a,b:q.b};
    const frames=Math.max(1,Math.ceil(q.W/10));let h='<div class="frames">',i=0;
    for(let fr=0;fr<frames;fr++){h+='<div class="frame">';for(let j=0;j<10;j++,i++)h+=`<span class="dot ${i<k.a?'a':i<k.a+k.b?'b':''}"></span>`;h+='</div>'}
    return h+'</div><p class="note" style="text-align:center">'+(q.hide==='w'?'Count all the counters.':`The empty spots up to ${q.W} are the missing part.`)+'</p>';
  }
  if(q.kind==='frac'){
    let h='';for(let w=0;w<q.W/q.d;w++){h+=`<div class="bar" style="grid-template-columns:repeat(${q.d},1fr)">`;
      for(let j=0;j<q.d;j++)h+=`<span class="${w*q.d+j<q.known?'a':''}"></span>`;h+='</div>'}
    return h+`<p class="note" style="text-align:center">Each bar is 1 whole, which is ${q.d}/${q.d}. Count the empty pieces.</p>`;
  }
  // place value: count up in friendly jumps, or use a smaller fact
  const k=q.known;let g=1;while(g*10<q.W&&k%(g*10)===0)g*=10;
  if(g>1)return `<p class="note" style="text-align:center">Think ${k/g} + ? = ${q.W/g}, counting in ${q.fmt(g)}s.</p>`;
  const jumps=[];let cur=k,p=10;
  while(cur<q.W){const nx=Math.min(Math.ceil((cur+1)/p)*p,q.W);if(nx>cur){jumps.push(`+ ${q.fmt(nx-cur)} → ${q.fmt(nx)}`);cur=nx}p*=10}
  return `<p class="note" style="text-align:center">Count up from ${q.fmt(k)}: ${jumps.join(', ')}. Add the jumps.</p>`;
}
$('hintBtn').onclick=()=>{
  const h=$('hint');
  if(!h.hidden){h.hidden=true;$('hintBtn').textContent='Show a hint';return}
  h.innerHTML=hintHTML();h.hidden=false;$('hintBtn').textContent='Hide hint';
};
function pickBond(v,btn){
  if(locked)return;
  if(v===q.ans){
    locked=true;btn.classList.add('yes');
    setText({w:'tW',a:'tA',b:'tB'}[q.hide],q.fmt(q.ans),true);$('bond').classList.add('win');
    $('eq').innerHTML=eqHTML(true);$('eq').classList.add('win');
    round.push(missed?'miss':'done');
    if(!missed){streak++;if(streak>best){best=streak;store.set('nb-best2',best)}}else streak=0;
    const f=q.fmt;
    $('bMsg').textContent=`${pick(cheers)}  ${f(q.a)} + ${f(q.b)} = ${f(q.W)}, so ${f(q.W)} − ${f(q.a)} = ${f(q.b)}`;
    paintProgress();setTimeout(nextBond,1500);
  }else{
    missed=true;btn.classList.add('no');btn.disabled=true;
    $('bond').classList.remove('shake');void $('bond').getBoundingClientRect();$('bond').classList.add('shake');
    $('bMsg').textContent='Not quite. Try again, or tap Show a hint.';
  }
  $('streak').textContent=streak;$('best').textContent=best;
}
function paintProgress(){let h='';for(let i=0;i<ROUND;i++)h+=`<span class="${round[i]||''}"></span>`;$('progress').innerHTML=h}
function finishBonds(){
  const first=round.filter(r=>r==='done').length;
  $('bPlay').style.display='none';$('bEnd').hidden=false;$('choices').innerHTML='';$('bMsg').textContent='';
  $('bScore').textContent=`${first} / ${ROUND}`;
  const up=first>=9?(bl===1?' Ready for Level 2.':bg!=='5'?' Ready for the next grade.':''):'';
  $('bEndMsg').textContent=(first===ROUND?'Perfect round!':first>=7?'Strong work!':'Good practice. Each round gets faster.')+' Right on the first try.'+up;
}
$('bAgain').onclick=startRound;

/* ---------- MAKE THE NUMBER: Grades 1-2 and Grades 3-5 ---------- */
const MAKE={
  1:{band:'lo',nums:[1,6],ops:['+','-'],t:[5,15],note:'Grade 1: add and subtract with small numbers, target up to 15 (1.OA.2, 1.OA.6).'},
  2:{band:'lo',nums:[1,9],ops:['+','-'],t:[10,30],note:'Grade 2: add and subtract fluently, target up to 30 (2.OA.2, 2.NBT.5).'},
  3:{band:'hi',nums:[1,9],ops:['+','-','*','/'],t:[10,50],need:['*','/'],note:'Grade 3: multiply and divide within 100, target up to 50 (3.OA.7, 3.OA.8).'},
  4:{band:'hi',nums:[1,12],ops:['+','-','*','/'],t:[20,100],need:['*'],note:'Grade 4: multi-step problems with bigger numbers, target up to 100 (4.OA.3).'},
  5:{band:'hi',nums:[1,12],ops:['+','-','*','/'],t:[24,24],need:['*','/'],note:'Grade 5: classic Make 24. Read your answer as one expression with parentheses (5.OA.1).'}
};
let mg=String(store.get('mn-g','2')), solved=store.get('mn-solved',0), puzzle=null, tiles=[], hist=[], sel=null, op=null, done=false;
if(!MAKE[mg])mg='2';
const sym={'+':'+','-':'−','*':'×','/':'÷'};
function apply(a,o,b){return o==='+'?a+b:o==='-'?a-b:o==='*'?a*b:(b!==0&&a%b===0?a/b:null)}
document.querySelectorAll('#mBands button').forEach(b=>b.onclick=()=>{mg=b.dataset.band==='lo'?'2':'3';store.set('mn-g',mg);newPuzzle()});
function paintMakeControls(){
  const band=MAKE[mg].band;
  document.querySelectorAll('#mBands button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.band===band));
  $('mGrades').innerHTML=Object.keys(MAKE).filter(g=>MAKE[g].band===band).map(g=>`<button data-g="${g}" aria-pressed="${g===mg}">${g}</button>`).join('');
  document.querySelectorAll('#mGrades button').forEach(b=>b.onclick=()=>{mg=b.dataset.g;store.set('mn-g',mg);newPuzzle()});
  $('mNote').textContent=MAKE[mg].note;
  document.querySelectorAll('#ops button').forEach(b=>b.hidden=!MAKE[mg].ops.includes(b.dataset.op));
  $('target').querySelector('small').textContent=mg==='5'?'Make 24':'Make';
}
function newPuzzle(){
  const c=MAKE[mg];paintMakeControls();
  for(let tries=0;tries<20000;tries++){
    const ns=Array.from({length:4},()=>c.nums[0]+rnd(c.nums[1]-c.nums[0]+1));
    let pool=ns.map(v=>({v,e:String(v),c:false})), way=[], used=[], ok=true;
    while(pool.length>1){
      const i=rnd(pool.length);let j=rnd(pool.length-1);if(j>=i)j++;
      let A=pool[i],B=pool[j];const o=pick(c.ops);
      if((o==='-'||o==='/')&&A.v<B.v)[A,B]=[B,A];
      const r=apply(A.v,o,B.v);
      if(r===null||r<0||(o==='*'&&(A.v===1||B.v===1))||(o==='/'&&B.v===1)){ok=false;break}
      used.push(o);way.push(`${A.v} ${sym[o]} ${B.v} = ${r}`);
      const e=(A.c?`(${A.e})`:A.e)+` ${sym[o]} `+(B.c?`(${B.e})`:B.e);
      pool=pool.filter((_,k)=>k!==i&&k!==j);pool.push({v:r,e,c:true});
    }
    if(!ok)continue;
    const t=pool[0].v;
    if(t<c.t[0]||t>c.t[1])continue;
    if(c.need&&!used.some(o=>c.need.includes(o)))continue;
    puzzle={ns,t,way,expr:pool[0].e};break;
  }
  resetTiles();
}
function resetTiles(){
  tiles=puzzle.ns.map(v=>({v,e:String(v),c:false,gone:false,isNew:false}));hist=[];sel=null;op=null;done=false;
  $('tNum').textContent=puzzle.t;$('target').classList.remove('win');$('mMsg').textContent='';renderTiles();
}
function renderTiles(){
  $('nums').innerHTML='';
  tiles.forEach((t,i)=>{
    const b=document.createElement('button');b.textContent=t.gone?'':t.v;b.disabled=t.gone;
    if(sel===i)b.classList.add('sel');else if(t.isNew)b.classList.add('new');
    b.onclick=()=>tapNum(i);$('nums').appendChild(b);
  });
  document.querySelectorAll('#ops button').forEach(b=>b.classList.toggle('sel',b.dataset.op===op));
  $('steps').textContent=hist.map(h=>h.line).join('   ');
}
function tapNum(i){
  if(done)return;
  if(sel===null||op===null||sel===i){sel=(sel===i&&op===null)?null:i;op=sel===null?null:op;renderTiles();return}
  const A=tiles[sel],B=tiles[i],r=apply(A.v,op,B.v);
  if(r===null){say(`${A.v} ÷ ${B.v} doesn't come out even. Try another way.`,true);return}
  if(r<0){say(`${A.v} − ${B.v} goes below zero. Try the bigger number first.`,true);return}
  hist.push({snap:JSON.stringify(tiles),line:`${A.v} ${sym[op]} ${B.v} = ${r}`});
  const e=(A.c?`(${A.e})`:A.e)+` ${sym[op]} `+(B.c?`(${B.e})`:B.e);
  tiles[sel]={...A,gone:true};tiles[i]={v:r,e,c:true,gone:false,isNew:true};
  sel=null;op=null;$('mMsg').textContent='';
  const left=tiles.filter(t=>!t.gone);renderTiles();
  if(left.length===1){
    if(left[0].v===puzzle.t){done=true;solved++;store.set('mn-solved',solved);$('solved').textContent=solved;
      $('target').classList.add('win');say(`${pick(cheers)} ${left[0].e} = ${puzzle.t}`);setTimeout(newPuzzle,2600)}
    else say(`That makes ${left[0].v}, not ${puzzle.t}. Tap Undo and try a different sign.`,true);
  }
}
document.querySelectorAll('#ops button').forEach(b=>b.onclick=()=>{
  if(done)return;
  if(sel===null){say('Tap a number first.',true);return}
  op=op===b.dataset.op?null:b.dataset.op;renderTiles();
});
function say(t,bad){$('mMsg').textContent=t;if(bad){const n=$('nums');n.classList.remove('shake');void n.offsetWidth;n.classList.add('shake')}}
$('undo').onclick=()=>{if(done||!hist.length)return;const h=hist.pop();tiles=JSON.parse(h.snap);sel=null;op=null;$('mMsg').textContent='';renderTiles()};
$('restart').onclick=()=>{if(!done)resetTiles()};
$('showWay').onclick=()=>{$('mMsg').textContent=(mg>='3'?`One way: ${puzzle.expr} = ${puzzle.t}`:'One way: '+puzzle.way.join(', then '))};
$('skip').onclick=newPuzzle;

/* ---------- boot ---------- */
$('best').textContent=best;$('solved').textContent=solved;
startRound();newPuzzle();
</script>
